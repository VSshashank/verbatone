<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Verbatone Mic</title>
    <style>
      :root { color-scheme: dark; }
      body {
        align-items: center;
        background: #101214;
        color: #f5f7fa;
        display: flex;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        justify-content: center;
        margin: 0;
        min-height: 100vh;
      }
      main {
        align-items: center;
        display: flex;
        flex-direction: column;
        gap: 18px;
        max-width: 360px;
        padding: 28px;
        text-align: center;
      }
      h1 { font-size: 28px; margin: 0; }
      p { color: #a1a1aa; line-height: 1.5; margin: 0; }
      button {
        border: 0;
        border-radius: 999px;
        color: white;
        font-size: 20px;
        font-weight: 700;
        min-height: 74px;
        padding: 0 34px;
        width: 100%;
      }
      #start { background: #14b8a6; }
      #stop { background: #ef4444; display: none; }
      #fallback { display: none; width: 100%; }
      #fallback label {
        background: #27272a;
        border: 1px solid #3f3f46;
        border-radius: 18px;
        color: #f4f4f5;
        display: block;
        font-weight: 700;
        padding: 18px;
      }
      #fallback input { display: none; }
      #status { color: #ccfbf1; font-size: 14px; min-height: 22px; }
    </style>
  </head>
  <body>
    <main>
      <h1>Verbatone Mic</h1>
      <p>Hold your phone close while the desktop plays the backing track.</p>
      <div id="status">Ready</div>
      <button id="start" type="button">Start singing</button>
      <button id="stop" type="button">Done</button>
      <div id="fallback">
        <p>Your browser is blocking live mic access on this local link. Record audio with your phone, then upload it here.</p>
        <label for="file">Upload recording</label>
        <input id="file" type="file" accept="audio/*" capture />
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const trackId = params.get("track_id") || "";
      const statusEl = document.getElementById("status");
      const startBtn = document.getElementById("start");
      const stopBtn = document.getElementById("stop");
      const fallbackEl = document.getElementById("fallback");
      const fileInput = document.getElementById("file");
      let recorder;
      let chunks = [];

      function uploadUrl() {
        return `/api/karaoke/submit${trackId ? `?track_id=${encodeURIComponent(trackId)}` : ""}`;
      }

      function showFallback(message) {
        statusEl.textContent = message || "Live microphone is not available.";
        fallbackEl.style.display = "flex";
        fallbackEl.style.flexDirection = "column";
        fallbackEl.style.gap = "14px";
        startBtn.style.display = "none";
        stopBtn.style.display = "none";
      }

      async function submitBlob(blob) {
        const response = await fetch(uploadUrl(), {
          method: "POST",
          headers: { "Content-Type": blob.type || "audio/webm" },
          body: blob,
        });
        if (!response.ok) throw new Error("Upload failed.");
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
        showFallback("This browser cannot use live mic recording on this link.");
      }

      startBtn.addEventListener("click", async () => {
        try {
          if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) {
            showFallback("This browser cannot use live mic recording on this link.");
            return;
          }
          chunks = [];
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          recorder = new MediaRecorder(stream);
          recorder.ondataavailable = (event) => {
            if (event.data && event.data.size) chunks.push(event.data);
          };
          recorder.start();
          startBtn.style.display = "none";
          stopBtn.style.display = "block";
          statusEl.textContent = "Recording...";
        } catch (error) {
          showFallback(error.message || "Microphone permission failed.");
        }
      });

      stopBtn.addEventListener("click", () => {
        if (!recorder) return;
        stopBtn.disabled = true;
        statusEl.textContent = "Sending...";
        recorder.onstop = async () => {
          try {
            const blob = new Blob(chunks, { type: "audio/webm" });
            await submitBlob(blob);
            statusEl.textContent = "Submitted. Check the desktop.";
            stopBtn.style.display = "none";
          } catch (error) {
            stopBtn.disabled = false;
            statusEl.textContent = error.message || "Could not submit recording.";
          }
        };
        recorder.stop();
        recorder.stream.getTracks().forEach((track) => track.stop());
      });

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files && fileInput.files[0];
        if (!file) return;
        try {
          statusEl.textContent = "Uploading...";
          await submitBlob(file);
          statusEl.textContent = "Submitted. Check the desktop.";
        } catch (error) {
          statusEl.textContent = error.message || "Could not upload recording.";
        }
      });
    </script>
  </body>
</html>
